<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Contact form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Contact Us</h1>

    <form id="contact-form" novalidate>
      <div class="form-row" role="group" aria-label="Name">
        <div class="form-group">
          <label for="first-name">First Name *</label>
          <input type="text" id="first-name" name="firstName" required aria-invalid="false" aria-describedby="firstNameError">
          <div id="firstNameError" class="error-message" aria-live="polite"></div>
        </div>
        <div class="form-group">
          <label for="last-name">Last Name *</label>
          <input type="text" id="last-name" name="lastName" required aria-invalid="false" aria-describedby="lastNameError">
          <div id="lastNameError" class="error-message" aria-live="polite"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required aria-invalid="false" aria-describedby="emailError">
        <div id="emailError" class="error-message" aria-live="polite"></div>
      </div>

      <div class="form-group">
        <fieldset>
          <legend>Query Type *</legend>
          <div class="radio-group" role="radiogroup" aria-label="Query Type" aria-invalid="false" aria-describedby="queryTypeError">
            <div class="radio-option">
              <input type="radio" id="general-enquiry" name="queryType" value="General Enquiry" required role="radio">
              <label for="general-enquiry">General Enquiry</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="support-request" name="queryType" value="Support Request" required role="radio">
              <label for="support-request">Support Request</label>
            </div>
          </div>
          <div id="queryTypeError" class="error-message" aria-live="polite"></div>
        </fieldset>
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="4" required></textarea>
        <div id="messageError" class="error-message" aria-live="polite"></div>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">I consent to being contacted by the team *</label>
        <div id="consentError" class="error-message" aria-live="polite"></div>
      </div>

      <button type="submit">Submit</button>
    </form>
  </main>

  <div id="success-toast" class="toast" role="alert" aria-live="assertive">
    <div class="toast-header">
      <img src="./assets/images/icon-success.svg" alt="">
      <span>Message Sent!</span>
    </div>
    <p>Thanks for completing the form. We'll be in touch soon!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
